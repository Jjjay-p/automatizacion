name: Monitor de Noticias con IA

on:
  schedule:
    - cron: '0 8,16 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías
        run: |
          pip install google-genai

      - name: Ejecutar script de análisis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Guardar informe en el repositorio
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add reporte_*.md
          git commit -m "Nuevo reporte de noticias generado por IA" || exit 0
          git push
